name: Publish Passui packages

# Never triggered by a push. It runs from the `release` job in ci.yml (after
# check passes on a commit marked `chore(release):` or `[release]`), or by
# hand. Either way the gate job below must find check green for the
# commit before anything is published. Keep the file name: the npm trusted
# publishers are bound to `publish.yml`.
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish ("all" is tokens, icons, ui, then tanstack)
        required: true
        default: all
        type: choice
        options:
          - all
          - tokens
          - icons
          - ui
          - tanstack
          - cli
      sha:
        description: Commit to publish. Defaults to the head of main.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.inputs.package }}
  cancel-in-progress: false

jobs:
  gate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Require a green check for the commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.inputs.sha || github.sha }}
        run: |
          for job in check; do
            result=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name == \"$job\")] | map(.conclusion) | if length > 0 and all(. == \"success\") then \"success\" else \"missing or failed\" end")
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              echo "::error::$job has not passed for $SHA, so nothing is published."
              exit 1
            fi
          done
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        package: ${{ github.event.inputs.package == 'all' && fromJSON('["tokens","icons","ui","tanstack"]') || fromJSON(format('["{0}"]', github.event.inputs.package)) }}
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Set up Node for npm OIDC
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Check whether version is already published
        id: registry
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json >/dev/null 2>&1; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published."
          else
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "Preparing $PACKAGE_NAME@$PACKAGE_VERSION for publication."
          fi

      - name: Install dependencies
        if: steps.registry.outputs.published == 'false'
        run: bun install --frozen-lockfile
        working-directory: .

      - name: Validate workspace
        if: steps.registry.outputs.published == 'false'
        run: |
          bun run check
          bun run build
          bun run typecheck
          bun run test
          bun run publish:check
        working-directory: .

      - name: Pack with Bun
        if: steps.registry.outputs.published == 'false'
        run: |
          mkdir -p "$RUNNER_TEMP/passui-release"
          bun pm pack --destination "$RUNNER_TEMP/passui-release"

      - name: Publish with npm OIDC
        if: steps.registry.outputs.published == 'false'
        run: |
          npm --version
          npm publish "$RUNNER_TEMP"/passui-release/*.tgz --access public --registry https://registry.npmjs.org --loglevel verbose
