name: Publish Passui packages

on:
    workflow_dispatch:
        inputs:
            package:
                description: Package to publish
                required: true
                default: ui
                type: choice
                options:
                    - tokens
                    - ui
                    - solid
                    - tanstack
                    - cli

permissions:
    contents: read

concurrency:
    group: npm-publish-${{ inputs.package }}
    cancel-in-progress: false

jobs:
    publish:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        defaults:
            run:
                working-directory: packages/${{ inputs.package }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Set up Node for npm OIDC
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Update npm for trusted publishing
              run: npm install --global npm@latest

            - name: Install dependencies
              run: bun install --frozen-lockfile
              working-directory: .

            - name: Validate workspace
              run: |
                  bun run check
                  bun run build
                  bun run typecheck
                  bun run test
                  bun run solid:parity
                  bun run publish:check
              working-directory: .

            - name: Pack with Bun
              run: |
                  mkdir -p "$RUNNER_TEMP/passui-release"
                  bun pm pack --destination "$RUNNER_TEMP/passui-release"

            - name: Publish with npm OIDC
              run: npm publish "$RUNNER_TEMP"/passui-release/*.tgz --access public
