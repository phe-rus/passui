name: Publish Passui packages

on:
    workflow_run:
        workflows: ["Passui CI"]
        types: [completed]
        branches: [main]
    workflow_dispatch:
        inputs:
            package:
                description: Package to publish
                required: true
                default: solid
                type: choice
                options:
                    - tokens
                    - ui
                    - solid
                    - tanstack
                    - cli

permissions:
    contents: read

concurrency:
    group: npm-publish-${{ github.event.inputs.package || 'auto' }}
    cancel-in-progress: false

jobs:
    publish:
        strategy:
            fail-fast: false
            matrix:
                package: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.package)) || fromJSON('["solid","tanstack"]') }}
        if: >-
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
            (github.event_name == 'workflow_run' &&
             github.event.workflow_run.conclusion == 'success' &&
             github.event.workflow_run.event == 'push' &&
             github.event.workflow_run.head_branch == 'main' &&
             github.event.workflow_run.head_repository.full_name == github.repository)
        runs-on: ubuntu-latest
        environment: npm-publish
        permissions:
            contents: read
            id-token: write
        defaults:
            run:
                working-directory: packages/${{ matrix.package }}
        steps:
            - name: Checkout validated commit
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.event.workflow_run.head_sha || github.sha }}

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.2

            - name: Set up Node for npm OIDC
              uses: actions/setup-node@v6
              with:
                  node-version: "24"
                  registry-url: https://registry.npmjs.org
                  package-manager-cache: false

            - name: Update npm for trusted publishing
              run: npm install --global npm@latest

            - name: Check whether version is already published
              id: registry
              run: |
                  PACKAGE_NAME=$(node -p "require('./package.json').name")
                  PACKAGE_VERSION=$(node -p "require('./package.json').version")
                  if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json >/dev/null 2>&1; then
                      echo "published=true" >> "$GITHUB_OUTPUT"
                      echo "$PACKAGE_NAME@$PACKAGE_VERSION is already published."
                  else
                      echo "published=false" >> "$GITHUB_OUTPUT"
                      echo "Preparing $PACKAGE_NAME@$PACKAGE_VERSION for publication."
                  fi

            - name: Install dependencies
              if: steps.registry.outputs.published == 'false'
              run: bun install --frozen-lockfile
              working-directory: .

            - name: Validate workspace
              if: steps.registry.outputs.published == 'false'
              run: |
                  bun run check
                  bun run build
                  bun run typecheck
                  bun run test
                  bun run solid:parity
                  bun run publish:check
              working-directory: .

            - name: Pack with Bun
              if: steps.registry.outputs.published == 'false'
              run: |
                  mkdir -p "$RUNNER_TEMP/passui-release"
                  bun pm pack --destination "$RUNNER_TEMP/passui-release"

            - name: Publish with npm OIDC
              if: steps.registry.outputs.published == 'false'
              run: npm publish "$RUNNER_TEMP"/passui-release/*.tgz --access public
