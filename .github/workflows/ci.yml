name: Passui CI

on:
  # Every push runs check. The Playwright e2e job runs only on a manual dispatch
  # or a commit marked `[e2e]`, never locally and never as a release gate. Only a
  # release marked commit on main goes further (see the release job).
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run --cwd packages/cli build
      - run: node packages/cli/dist/passui.js --help
      - run: bun run --cwd www type-gen
      - run: bun run build
      - run: bun run test
      - run: bun run publish:check
      - run: bun run size:check

  e2e:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[e2e]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: bun install --frozen-lockfile
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      # On a cache hit the browsers are reused; --with-deps still installs the
      # system libraries, which the cache does not hold.
      - run: bunx playwright install --with-deps chromium webkit
        working-directory: packages/ui
      - run: bun run --cwd packages/ui test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: |
            packages/ui/test-results/
            packages/ui/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Runs only for a release marked commit on main (or a manual dispatch on
  # main), and only after check passed. It does not publish itself: npm
  # trusts the workflow file publish.yml, so this job dispatches that workflow
  # for this exact commit, and publish.yml verifies check again.
  release:
    needs: [check]
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' &&
        (startsWith(github.event.head_commit.message, 'chore(release):') ||
         contains(github.event.head_commit.message, '[release]'))))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch the publish workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run publish.yml
          --repo "$GITHUB_REPOSITORY"
          --ref main
          -f package=all
          -f sha="$GITHUB_SHA"
